[project]
name = "trap-tester"
version = "0.1.0"
description = "GUI and scripts for the Modular Trap Tester analog frontend (Analog Discovery 2/3)."
authors = [
    { name = "Michael Marti", email = "michael@zuriq.com" },
    { name = "Michael Marti", email = "micmarti@ethz.ch" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "pillow>=12.0.0,<13",
    "dwfpy>=1.2.0,<2",
    "PySide6>=6.7",
]

[project.scripts]
trap-tester-gui = "trap_tester.gui.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.1.1",
    "pyright>=1.1.323",
    "ruff>=0.1.5",
    "pytest>=8.0",
]
packaging = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trap_tester"]


[tool.pytest.ini_options]
# Only collect the refactored, hardware-free regression suites in ``tests/``.
# The legacy hardware scripts live in ``scripts/hardware/`` (outside testpaths);
# they run hardware code at import time and would hang a bare ``pytest`` run.
testpaths = ["tests"]
python_files = ["test_*_core.py"]


[tool.pyright]
include = ["src/trap_tester", "tests"]
typeCheckingMode = "basic"


[tool.ruff]
target-version = "py311" # Matches requires-python (>=3.11)
extend-exclude = [
  "docs", "tests"
]

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "C901",  # mccabe complex-structure
    "E",     # pycodestyle errors
    "ERA",   # eradicate
    "F",     # pyflakes
    "FLY",   # flynt
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "W",     # pycodestyle warnings
]
ignore = [
    "PERF203",  # try-except-in-loop
]

[tool.ruff.lint.mccabe]
max-complexity = 7


[tool.mypy]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
ignore_missing_imports = false
