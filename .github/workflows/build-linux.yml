name: Build Linux executable

# Freezes the GUI with PyInstaller on Linux and publishes the bundle:
#   * on every run  -> as a workflow artifact (downloadable from the run page)
#   * on a release  -> additionally attached to that release as an asset
#
# PyInstaller does not cross-compile, so this job only produces the Linux
# x86_64 build; macOS/Windows bundles still have to be built on those systems
# (see "Building a standalone executable" in the README).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PyInstaller (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to attach the archive to the release
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        # PySide6 dlopen()s these; without them the offscreen smoke test below
        # cannot load the Qt platform plugin. libdwf (WaveForms) is deliberately
        # absent — the app must still start and show its "runtime missing" banner.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group packaging

      - name: Run the regression suite
        run: uv run pytest -q

      - name: Build the bundle
        run: uv run pyinstaller --noconfirm trap-tester.spec

      - name: Smoke-test the bundle
        # The GUI has no headless exit path, so let it run briefly and treat the
        # timeout (124) as success; any other exit code, or a traceback on
        # stderr, means the frozen bundle is broken (missing data file, import…).
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          status=0
          timeout 30s ./dist/trap-tester/trap-tester 2>&1 | tee launch.log || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::the frozen launcher exited with status $status"
            exit 1
          fi
          if grep -q Traceback launch.log; then
            echo "::error::the frozen launcher printed a traceback"
            exit 1
          fi

      - name: Package the bundle
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG:-dev-$(git rev-parse --short HEAD)}"
          name="trap-tester-${version}-linux-x86_64"
          mv dist/trap-tester "dist/${name}"
          tar -czf "${name}.tar.gz" -C dist "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
